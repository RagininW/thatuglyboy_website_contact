<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>contact — that ugly boy</title>
<link rel="icon" type="image/png" href="favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  @font-face {
    font-family: 'ugly_boy';
    src: url('fonts/ugly_boy.ttf') format('truetype');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'avenir';
    src: url('fonts/avenir.ttf') format('truetype');
    font-weight: 400; font-style: normal; font-display: swap;
    size-adjust: 100%; ascent-override: 85%; descent-override: 25%; line-gap-override: 0%;
  }

  /* same tokens as the main site — keep in sync with ../main-site/index.html */
  :root {
    --font-logo: 'ugly_boy', serif;
    --font-body: 'avenir', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;

    --bg:     #0a0a0a;
    --fg:     #e8e4dc;
    --dim:    #8a857c;
    --faint:  #3a3731;
    --hair:   #1f1d1a;
    --accent: #c7442a;

    --gutter: 32px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: var(--bg); }

  .page {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 var(--gutter);
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  /* ---------- top ---------- */
  .top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 28px 0 24px;
    border-bottom: 1px solid var(--hair);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .back { transition: color .2s; }
  .back:hover { color: var(--fg); }
  .back .arr { display: inline-block; margin-right: 8px; transition: transform .2s; }
  .back:hover .arr { transform: translateX(-3px); }

  .lang-switch { display: flex; align-items: center; gap: 6px; }
  .lang-btn {
    background: none; border: none; padding: 0; cursor: pointer;
    font: inherit; color: var(--dim);
    letter-spacing: .26em; text-transform: uppercase;
    transition: color .2s;
  }
  .lang-btn:hover { color: var(--fg); }
  .lang-btn.active { color: var(--accent); }
  .lang-switch .sep { color: var(--faint); }

  /* ---------- masthead ---------- */
  main { flex: 1; padding: 72px 0 0; }
  h1 {
    font-family: var(--font-logo);
    font-weight: 400;
    font-size: clamp(72px, 16vw, 190px);
    line-height: .95;
    letter-spacing: .01em;
    text-transform: lowercase;
    margin: 0;
    color: var(--fg);
  }
  .lead {
    margin-top: 22px;
    max-width: 46ch;
    color: var(--dim);
  }

  /* ---------- channel list ---------- */
  .channels {
    margin-top: 56px;
    border-top: 1px solid var(--hair);
  }
  .ch {
    display: grid;
    grid-template-columns: 160px 1fr auto;
    align-items: baseline;
    gap: 24px;
    padding: 20px 0;
    border-bottom: 1px solid var(--hair);
    transition: color .15s;
  }
  a.ch:hover { color: var(--accent); }
  .ch-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--dim);
  }
  a.ch:hover .ch-label { color: inherit; }
  .ch-val {
    font-family: var(--font-mono);
    font-size: 15px;
    letter-spacing: .02em;
    word-break: break-all;
  }
  .ch-arr {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--faint);
    transition: transform .2s, color .15s;
  }
  a.ch:hover .ch-arr { color: var(--accent); transform: translate(2px, -2px); }

  /* ---------- footer ---------- */
  footer {
    margin-top: 64px;
    padding: 18px 0 28px;
    border-top: 1px solid var(--hair);
    display: flex; justify-content: space-between; gap: 16px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--faint);
  }

  @media (max-width: 640px) {
    :root { --gutter: 16px; }
    main { padding-top: 48px; }
    .channels { margin-top: 40px; }
    .ch {
      grid-template-columns: 1fr auto;
      gap: 6px 16px;
    }
    .ch-label { grid-column: 1 / -1; }
    .ch-val { font-size: 14px; }
    footer { flex-direction: column; gap: 8px; }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="top">
      <a class="back" href="https://thatuglyboy.com"><span class="arr">←</span><span data-i18n="back">thatuglyboy.com</span></a>
      <div class="lang-switch">
        <button type="button" class="lang-btn" data-lang="en">EN</button><span class="sep">/</span><button type="button" class="lang-btn" data-lang="es">ES</button>
      </div>
    </header>

    <main>
      <h1 data-i18n="title">contact</h1>
      <p class="lead" data-i18n="lead"></p>

      <div class="channels">
        <a class="ch" href="mailto:ragininwarrior@gmail.com">
          <span class="ch-label" data-i18n="email">email</span>
          <span class="ch-val">ragininwarrior@gmail.com</span>
          <span class="ch-arr">↗</span>
        </a>
        <a class="ch" href="https://instagram.com/that_ugly_boy" target="_blank" rel="noopener">
          <span class="ch-label">instagram</span>
          <span class="ch-val">@that_ugly_boy</span>
          <span class="ch-arr">↗</span>
        </a>
        <a class="ch" href="https://open.spotify.com/intl-es/artist/1eNOcuzzWUeNL3fI1xlofJ" target="_blank" rel="noopener">
          <span class="ch-label">spotify</span>
          <span class="ch-val">that ugly boy</span>
          <span class="ch-arr">↗</span>
        </a>
        <a class="ch" href="https://thatuglyboy.bandcamp.com/" target="_blank" rel="noopener">
          <span class="ch-label" data-i18n="links">bandcamp</span>
          <span class="ch-val">thatuglyboy.bandcamp.com</span>
          <span class="ch-arr">↗</span>
        </a>
      </div>
    </main>

    <footer>
      <span>that ugly boy © 2026</span>
      <span data-i18n="note"></span>
    </footer>
  </div>

<script>
  // same copy register as the main site: declarative, no second person.
  var I18N = {
    en: {
      back:  'thatuglyboy.com',
      title: 'contact',
      lead:  'four ways in. email is the fastest. everything else is slower.',
      email: 'email',
      links: 'links',
      note:  'mexico'
    },
    es: {
      back:  'thatuglyboy.com',
      title: 'contacto',
      lead:  'cuatro formas de llegar. el correo es lo más rápido. lo demás es más lento.',
      email: 'correo',
      links: 'enlaces',
      note:  'méxico'
    }
  };

  // This page is one Worker served on two hostnames, and the hostname *is* the
  // language: contact. = en, contacto. = es. That is what carries the choice
  // across origins — localStorage cannot, since every hostname gets its own.
  var HOSTS = { en: 'https://contact.thatuglyboy.com', es: 'https://contacto.thatuglyboy.com' };
  // main site can't read this origin's storage either, so say it in the URL
  var BACK  = { en: 'https://thatuglyboy.com/?lang=en', es: 'https://thatuglyboy.com/?lang=es' };

  // null on workers.dev or localhost, where neither hostname applies
  function langFromHost() {
    var h = location.hostname.replace(/^www\./, '');
    if (h.indexOf('contacto.') === 0) return 'es';  // test before 'contact.'
    if (h.indexOf('contact.') === 0) return 'en';
    return null;
  }

  var LANG = langFromHost();
  if (!LANG) { try { LANG = localStorage.getItem('tub:lang'); } catch (e) {} }
  if (!I18N[LANG]) LANG = 'en';

  function apply(lang) {
    LANG = lang;
    var dict = I18N[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var key = el.getAttribute('data-i18n');
      if (dict[key] !== undefined) el.textContent = dict[key];
    });
    document.title = dict.title + ' — that ugly boy';
    var back = document.querySelector('.back');
    if (back) back.href = BACK[lang];
    document.querySelectorAll('[data-lang]').forEach(function (b) {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
  }

  document.querySelectorAll('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () {
      var next = b.dataset.lang;
      try { localStorage.setItem('tub:lang', next); } catch (e) {}
      // on the real hostnames the URL has to stay truthful, so switch by
      // navigating; elsewhere (workers.dev, localhost) just swap in place
      if (langFromHost() && langFromHost() !== next) { location.href = HOSTS[next]; return; }
      apply(next);
    });
  });

  apply(LANG);
</script>
</body>
</html>
